name: Create New Raid Discord Message

on:
  workflow_dispatch:

jobs:
  create-message:
    runs-on: ubuntu-latest

    steps:
      - name: Create new Discord raid message
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret is missing."
            exit 1
          fi

          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone, timedelta

          FIREBASE_URL = "https://raid-c2ee1-default-rtdb.firebaseio.com/raid_schedule.json"

          # Firebase 최신 일정 읽기
          with urllib.request.urlopen(FIREBASE_URL, timeout=20) as response:
              data = json.loads(response.read().decode("utf-8"))

          if not isinstance(data, list):
              raise SystemExit("Firebase data format is not an array.")

          print("Firebase read: OK")

          members = [
              "뱁새",
              "담곰",
              "두지",
              "깜고",
              "이리",
              "시요",
              "도찌"
          ]

          days = [
              "목요일",
              "금요일",
              "토요일",
              "일요일",
              "월요일",
              "화요일",
              "수요일"
          ]

          hours = [
              "10:00",
              "11:00",
              "12:00",
              "13:00",
              "14:00",
              "15:00",
              "16:00",
              "17:00",
              "18:00",
              "19:00",
              "20:00",
              "21:00",
              "22:00",
              "23:00",
              "24:00",
              "01:00",
              "02:00"
          ]

          parties = [
              {
                  "name": "두지팟",
                  "members": [
                      "두지",
                      "시요",
                      "뱁새",
                      "담곰",
                      "이리",
                      "깜고"
                  ],
                  "color": 0x9B59B6
              },
              {
                  "name": "도찌팟",
                  "members": [
                      "도찌",
                      "뱁새",
                      "담곰",
                      "이리",
                      "깜고"
                  ],
                  "color": 0xE91E63
              }
          ]

          # 한국 시간
          KST = timezone(timedelta(hours=9))
          now = datetime.now(KST)
          updated_at = now.strftime("%Y.%m.%d %H:%M")

          embeds = []

          for party in parties:

              party_indices = [
                  members.index(name)
                  for name in party["members"]
              ]

              lines = []

              for day_index, day_name in enumerate(days):

                  common = []

                  for hour_index in range(len(hours)):

                      try:
                          row = data[day_index][hour_index]
                      except (IndexError, TypeError):
                          row = []

                      # false = 가능
                      available = all(
                          isinstance(row, list)
                          and member_index < len(row)
                          and row[member_index] is False
                          for member_index in party_indices
                      )

                      common.append(available)

                  ranges = []
                  start = None

                  for h in range(len(common) + 1):

                      if h < len(common) and common[h]:

                          if start is None:
                              start = h

                      elif start is not None:

                          end_label = (
                              hours[h]
                              if h < len(hours)
                              else "03:00"
                          )

                          ranges.append(
                              f"{hours[start]}–{end_label}"
                          )

                          start = None

                  if ranges:
                      time_text = " · ".join(ranges)

                      lines.append(
                          f"**{day_name}**　▸ **{time_text}**"
                      )

                  else:
                      lines.append(
                          f"**{day_name}**　▸ -"
                      )

                  # 목금토일 / 월화수 구분선
                  if day_name == "일요일":
                      lines.append("────────────")

              embeds.append({
                  "title": party["name"],
                  "description": "\n".join(lines),
                  "color": party["color"],
                  "footer": {
                      "text": f"🕒 마지막 업데이트 · {updated_at} (KST)"
                  }
              })

          payload = {
              "content": (
                  "📅 **레이드 일정**\n"
                  "🔗 [일정 입력·수정하러 가기]"
                  "(https://wer2215-crypto.github.io/-/)"
              ),
              "embeds": embeds
          }

          with open(
              "/tmp/discord_payload.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  payload,
                  f,
                  ensure_ascii=False
              )

          print("Discord payload created.")
          PY

          echo "Creating NEW Discord message..."

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/discord_response.json \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --header "User-Agent: Mozilla/5.0" \
            --data-binary "@/tmp/discord_payload.json" \
            "${DISCORD_WEBHOOK}?wait=true")

          echo "Discord HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Discord rejected the new message."
            cat /tmp/discord_response.json
            exit 1
          fi

          echo "New Discord message created successfully."
