
name: Raid Schedule Discord Sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raid-discord-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Firebase and notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import os, json, hashlib, urllib.request, urllib.error, subprocess

          firebase_url = "https://raid-c2ee1-default-rtdb.firebaseio.com/raid_schedule.json"
          webhook = os.environ.get("DISCORD_WEBHOOK", "").strip()

          if not webhook:
              raise SystemExit("DISCORD_WEBHOOK secret is not configured.")

          req = urllib.request.Request(firebase_url)
          with urllib.request.urlopen(req, timeout=20) as response:
              data = json.loads(response.read().decode())

          if not isinstance(data, list):
              raise SystemExit("Firebase data format is not an array.")

          digest = hashlib.sha256(
              json.dumps(data, ensure_ascii=False, sort_keys=True).encode()
          ).hexdigest()

          state_file = ".github/last_schedule_hash.txt"
          old_hash = ""
          if os.path.exists(state_file):
              with open(state_file, encoding="utf-8") as f:
                  old_hash = f.read().strip()

          if digest == old_hash:
              print("No schedule changes. Discord notification skipped.")
              raise SystemExit(0)

          members = ["뱁새", "담곰", "두지", "깜고", "이리", "시요", "도찌"]
          days = ["목요일", "금요일", "토요일", "일요일", "월요일", "화요일", "수요일"]
          hours = [
              "10:00", "11:00", "12:00", "13:00", "14:00", "15:00",
              "16:00", "17:00", "18:00", "19:00", "20:00", "21:00",
              "22:00", "23:00", "24:00", "01:00", "02:00"
          ]
          parties = [
              ("두지팟", ["두지", "시요", "뱁새", "담곰", "이리", "깜고"], 0x9B59B6),
              ("도찌팟", ["도찌", "뱁새", "담곰", "이리", "깜고"], 0xE91E63)
          ]

          embeds = []
          for name, party_members, color in parties:
              fields = []
              for d, day in enumerate(days):
                  available = []
                  for h, _ in enumerate(hours):
                      row = data[d][h] if d < len(data) and h < len(data[d]) else []
                      can_play = True
                      for member in party_members:
                          idx = members.index(member)
                          if not isinstance(row, list) or idx >= len(row) or row[idx] is not False:
                              can_play = False
                              break
                      available.append(can_play)

                  ranges = []
                  start = None
                  for h in range(len(available) + 1):
                      if h < len(available) and available[h]:
                          if start is None:
                              start = h
                      elif start is not None:
                          end_label = hours[h] if h < len(hours) else "03:00"
                          ranges.append(f"{hours[start]}–{end_label}")
                          start = None

                  fields.append({
                      "name": day,
                      "value": ", ".join(ranges) if ranges else "공통 가능 시간 없음",
                      "inline": False
                  })

              embeds.append({
                  "title": f"{name} · 공통 가능 시간",
                  "description": "고정 파티원 전원이 가능한 시간입니다.",
                  "color": color,
                  "fields": fields
              })

          payload = json.dumps({
              "content": "📅 레이드 일정이 변경되었습니다.",
              "embeds": embeds
          }, ensure_ascii=False).encode()

          req = urllib.request.Request(
              webhook,
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              print("Discord notification sent:", response.status)

          os.makedirs(".github", exist_ok=True)
          with open(state_file, "w", encoding="utf-8") as f:
              f.write(digest + "\n")

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", state_file], check=True)
          subprocess.run(["git", "commit", "-m", "Update raid schedule sync state"], check=True)
          subprocess.run(["git", "push"], check=True)
          PY
