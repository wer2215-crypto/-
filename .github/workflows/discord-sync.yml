name: Raid Schedule Discord Sync

on:
  schedule:
    # 1시간마다 Firebase 일정 확인
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raid-discord-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Firebase and make Discord message
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import hashlib
          import os
          from datetime import datetime, timezone, timedelta

          FIREBASE_BASE = (
              "https://raid-c2ee1-default-rtdb.firebaseio.com"
          )

          # ==========================================
          # 1. Firebase 일정 읽기
          # ==========================================

          with urllib.request.urlopen(
              f"{FIREBASE_BASE}/raid_schedule.json",
              timeout=20
          ) as response:
              data = json.loads(
                  response.read().decode("utf-8")
              )

          if not isinstance(data, list):
              raise SystemExit(
                  "Firebase schedule data format is not an array."
              )

          print("Firebase schedule read: OK")

          # ==========================================
          # 2. Firebase 주간 시작 날짜 읽기
          #
          # 저장 형태:
          # raid_schedule_week: "2026-10-15"
          # ==========================================

          try:
              with urllib.request.urlopen(
                  f"{FIREBASE_BASE}/raid_schedule_week.json",
                  timeout=20
              ) as response:
                  week_data = json.loads(
                      response.read().decode("utf-8")
                  )

              print("Firebase week read: OK")

          except Exception as error:
              print("Firebase week read failed:", error)
              week_data = None

          # ==========================================
          # 3. 파티 확정시간 / 특이사항 읽기
          #
          # 저장 형태:
          # raid_party_start:
          #   dujiParty:
          #     date: "2026-10-18"
          #     time: "20:15"
          #     note: "시요 불참"
          # ==========================================

          try:
              with urllib.request.urlopen(
                  f"{FIREBASE_BASE}/raid_party_start.json",
                  timeout=20
              ) as response:
                  party_start_data = json.loads(
                      response.read().decode("utf-8")
                  )

              if not isinstance(party_start_data, dict):
                  party_start_data = {}

              print("Firebase party start read: OK")

          except Exception as error:
              print("Firebase party start read failed:", error)
              party_start_data = {}

          # ==========================================
          # 4. [10/15-10/21] 형식 만들기
          # ==========================================

          week_text = ""

          if isinstance(week_data, str):

              try:
                  # Firebase 값 = 목요일 시작 날짜
                  start = datetime.strptime(
                      week_data,
                      "%Y-%m-%d"
                  )

                  # 목요일 + 6일 = 수요일
                  end = start + timedelta(days=6)

                  week_text = (
                      f"[{start.month}/{start.day}"
                      f"-{end.month}/{end.day}]"
                  )

              except ValueError:
                  print("Invalid week date format.")

          print("Week:", week_text or "(none)")

          # ==========================================
          # 4. 일정 + 주간 날짜 변경 여부 확인
          #
          # 이제 일정 칸뿐 아니라
          # 달력에서 주만 바꿔도 변경으로 인식
          # ==========================================

          combined_state = {
              "schedule": data,
              "week": week_data,
              "party_start": party_start_data
          }

          digest = hashlib.sha256(
              json.dumps(
                  combined_state,
                  ensure_ascii=False,
                  sort_keys=True
              ).encode("utf-8")
          ).hexdigest()

          state_file = ".github/last_schedule_hash.txt"

          old_hash = ""

          if os.path.exists(state_file):
              with open(
                  state_file,
                  "r",
                  encoding="utf-8"
              ) as f:
                  old_hash = f.read().strip()

          if old_hash == digest:

              print("Schedule and week unchanged.")

              with open(
                  os.environ["GITHUB_ENV"],
                  "a"
              ) as f:
                  f.write("SEND_DISCORD=false\n")

              raise SystemExit(0)

          # ==========================================
          # 5. 멤버 / 요일 / 시간 설정
          # ==========================================

          members = [
              "뱁새",
              "담곰",
              "두지",
              "깜고",
              "이리",
              "시요",
              "도찌"
          ]

          days = [
              "목요일",
              "금요일",
              "토요일",
              "일요일",
              "월요일",
              "화요일",
              "수요일"
          ]

          hours = [
              "10:00",
              "11:00",
              "12:00",
              "13:00",
              "14:00",
              "15:00",
              "16:00",
              "17:00",
              "18:00",
              "19:00",
              "20:00",
              "21:00",
              "22:00",
              "23:00",
              "24:00",
              "01:00",
              "02:00"
          ]

          # ==========================================
          # 6. 고정 파티 설정
          # ==========================================

          parties = [
              {
                  "id": "dujiParty",
                  "name": "두지팟",
                  "members": [
                      "두지",
                      "시요",
                      "뱁새",
                      "담곰",
                      "이리",
                      "깜고"
                  ],
                  "color": 0x14145A
              },
              {
                  "id": "dozziParty",
                  "name": "도찌팟",
                  "members": [
                      "도찌",
                      "뱁새",
                      "담곰",
                      "이리",
                      "깜고"
                  ],
                  "color": 0xE91E63
              }
          ]

          # ==========================================
          # 7. 마지막 업데이트 시간 (한국 시간)
          # ==========================================

          KST = timezone(
              timedelta(hours=9)
          )

          now = datetime.now(KST)

          updated_at = now.strftime(
              "%Y.%m.%d %H:%M"
          )

          # ==========================================
          # 8. 파티별 공통 가능 시간 계산
          # ==========================================

          embeds = []

          for party in parties:

              party_indices = [
                  members.index(name)
                  for name in party["members"]
              ]

              lines = [
                  "──────────────"
              ]

              for day_index, day_name in enumerate(days):

                  common = []

                  for hour_index in range(len(hours)):

                      try:
                          row = data[
                              day_index
                          ][
                              hour_index
                          ]

                      except (IndexError, TypeError):
                          row = []

                      # false = 가능
                      available = all(
                          isinstance(row, list)
                          and member_index < len(row)
                          and row[member_index] is False
                          for member_index in party_indices
                      )

                      common.append(
                          available
                      )

                  ranges = []
                  start_index = None

                  for h in range(
                      len(common) + 1
                  ):

                      if (
                          h < len(common)
                          and common[h]
                      ):

                          if start_index is None:
                              start_index = h

                      elif start_index is not None:

                          end_label = (
                              hours[h]
                              if h < len(hours)
                              else "03:00"
                          )

                          ranges.append(
                              f"{hours[start_index]}"
                              f"–{end_label}"
                          )

                          start_index = None

                  # 가능한 시간 표시
                  if ranges:

                      time_text = " · ".join(
                          ranges
                      )

                      lines.append(
                          f"**{day_name}**　▸ "
                          f"**{time_text}**"
                      )

                  else:

                      lines.append(
                          f"**{day_name}**　▸ -"
                      )

                  # 일요일과 월요일 사이 구분선
                  if day_name == "일요일":

                      lines.append("")

              # 파티 확정시간 / 특이사항
              saved_start = party_start_data.get(
                  party["id"],
                  {}
              )

              if not isinstance(saved_start, dict):
                  saved_start = {}

              start_date = saved_start.get("date")
              start_time = saved_start.get("time")
              note = saved_start.get("note")

              # 확정시간이 저장되어 있으면:
              # 두지팟 10/18(일) 20:15
              # 없으면:
              # 두지팟 · 선택안됨
              if start_date and start_time:
                  try:
                      confirmed_date = datetime.strptime(
                          start_date,
                          "%Y-%m-%d"
                      )

                      weekday_names = [
                          "월", "화", "수", "목",
                          "금", "토", "일"
                      ]

                      weekday_text = weekday_names[
                          confirmed_date.weekday()
                      ]

                      embed_title = (
                          f'{party["name"]}  ▸ '
                          f'{confirmed_date.month}/'
                          f'{confirmed_date.day}'
                          f'({weekday_text}) '
                          f'{start_time}'
                      )

                  except (ValueError, TypeError):
                      embed_title = (
                          f'{party["name"]} ▸ 선택안됨'
                      )
              else:
                  embed_title = (
                      f'{party["name"]} ▸ 선택안됨'
                  )

              # 특이사항이 있을 때만 표시
              if isinstance(note, str) and note.strip():
                  lines.append(
                      "──────────────"
                  )
                  lines.append(
                      f"✅ {note.strip()}"
                  )

              # 파티 Embed
              embeds.append({
                  "title": embed_title,
                  "description": "\n".join(lines),
                  "color": party["color"],
                  "footer": {
                      "text": (
                          "🕒 마지막 업데이트 · "
                          f"{updated_at} (KST)"
                      )
                  }
              })

          # ==========================================
          # 9. Discord 상단 제목
          # ==========================================

          if week_text:

              discord_title = (
                  f"📅 **레이드 일정 {week_text}**"
              )

          else:

              discord_title = (
                  "📅 **레이드 일정**"
              )

          # ==========================================
          # 10. Discord 메시지 만들기
          # ==========================================

          payload = {
              "content": (
                  f"{discord_title}\n"
                  "🔗 [일정 입력·수정하기]"
                  "(https://wer2215-crypto.github.io/-/)"
              ),
              "embeds": embeds
          }

          with open(
              "/tmp/discord_payload.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  payload,
                  f,
                  ensure_ascii=False
              )

          # 새로운 상태 해시 저장 준비
          with open(
              "/tmp/new_schedule_hash.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  digest + "\n"
              )

          # 다음 GitHub Actions 단계에 전달
          with open(
              os.environ["GITHUB_ENV"],
              "a"
          ) as f:

              f.write(
                  "SEND_DISCORD=true\n"
              )

          print("Discord payload created.")
          print(
              f"Last update: {updated_at} KST"
          )

          PY

      # ==========================================
      # 11. 기존 Discord 메시지 수정
      # 새 메시지를 만들지 않고 PATCH
      # ==========================================

      - name: Update existing Discord message
        if: env.SEND_DISCORD == 'true'

        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_MESSAGE_ID: ${{ secrets.DISCORD_MESSAGE_ID }}

        run: |

          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret is missing."
            exit 1
          fi

          if [ -z "$DISCORD_MESSAGE_ID" ]; then
            echo "DISCORD_MESSAGE_ID secret is missing."
            exit 1
          fi

          echo "Updating existing Discord message..."

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/discord_response.txt \
            --write-out "%{http_code}" \
            --request PATCH \
            --header "Content-Type: application/json" \
            --header "User-Agent: Mozilla/5.0" \
            --data-binary "@/tmp/discord_payload.json" \
            "${DISCORD_WEBHOOK}/messages/${DISCORD_MESSAGE_ID}")

          echo "Discord HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then

            echo "Discord rejected the message update."

            cat /tmp/discord_response.txt

            exit 1

          fi

          echo "Existing Discord message updated successfully."

      # ==========================================
      # 12. 현재 상태 저장
      # ==========================================

      - name: Save schedule state
        if: env.SEND_DISCORD == 'true'

        run: |

          mkdir -p .github

          cp \
            /tmp/new_schedule_hash.txt \
            .github/last_schedule_hash.txt

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .github/last_schedule_hash.txt

          if git diff --cached --quiet; then

            echo "No state change to commit."

            exit 0

          fi

          git commit \
            -m "Update raid schedule sync state"

          git push
