name: Raid Schedule Discord Sync

on:
  schedule:
    # 1시간마다 Firebase 일정 확인
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raid-discord-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Firebase and make Discord message
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import hashlib
          import os
          from datetime import datetime, timezone, timedelta

          FIREBASE_URL = "https://raid-c2ee1-default-rtdb.firebaseio.com/raid_schedule.json"

          with urllib.request.urlopen(FIREBASE_URL, timeout=20) as response:
              data = json.loads(response.read().decode("utf-8"))

          if not isinstance(data, list):
              raise SystemExit("Firebase data format is not an array.")

          print("Firebase read: OK")

          digest = hashlib.sha256(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  sort_keys=True
              ).encode("utf-8")
          ).hexdigest()

          state_file = ".github/last_schedule_hash.txt"
          old_hash = ""

          if os.path.exists(state_file):
              with open(state_file, "r", encoding="utf-8") as f:
                  old_hash = f.read().strip()

          # 일정 변경이 없으면 Discord 메시지를 수정하지 않음
          if old_hash == digest:
              print("Schedule unchanged.")

              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write("SEND_DISCORD=false\n")

              raise SystemExit(0)

          members = [
              "뱁새",
              "담곰",
              "두지",
              "깜고",
              "이리",
              "시요",
              "도찌"
          ]

          days = [
              "목요일",
              "금요일",
              "토요일",
              "일요일",
              "월요일",
              "화요일",
              "수요일"
          ]

          hours = [
              "10:00",
              "11:00",
              "12:00",
              "13:00",
              "14:00",
              "15:00",
              "16:00",
              "17:00",
              "18:00",
              "19:00",
              "20:00",
              "21:00",
              "22:00",
              "23:00",
              "24:00",
              "01:00",
              "02:00"
          ]

          parties = [
              {
                  "name": "두지팟",
                  "members": [
                      "두지",
                      "시요",
                      "뱁새",
                      "담곰",
                      "이리",
                      "깜고"
                  ],
                  "color": 0x9B59B6
              },
              {
                  "name": "도찌팟",
                  "members": [
                      "도찌",
                      "뱁새",
                      "담곰",
                      "이리",
                      "깜고"
                  ],
                  "color": 0xE91E63
              }
          ]

          KST = timezone(timedelta(hours=9))
          now = datetime.now(KST)
          updated_at = now.strftime("%Y.%m.%d %H:%M")

          embeds = []

          for party in parties:

              party_indices = [
                  members.index(name)
                  for name in party["members"]
              ]

              lines = []

              for day_index, day_name in enumerate(days):

                  common = []

                  for hour_index in range(len(hours)):

                      try:
                          row = data[day_index][hour_index]
                      except (IndexError, TypeError):
                          row = []

                      # false = 가능
                      available = all(
                          isinstance(row, list)
                          and member_index < len(row)
                          and row[member_index] is False
                          for member_index in party_indices
                      )

                      common.append(available)

                  ranges = []
                  start = None

                  for h in range(len(common) + 1):

                      if h < len(common) and common[h]:

                          if start is None:
                              start = h

                      elif start is not None:

                          end_label = (
                              hours[h]
                              if h < len(hours)
                              else "03:00"
                          )

                          ranges.append(
                              f"{hours[start]}–{end_label}"
                          )

                          start = None

                  if ranges:
                      time_text = " · ".join(ranges)

                      lines.append(
                          f"**{day_name}**　▸ **{time_text}**"
                      )

                  else:
                      lines.append(
                          f"**{day_name}**　▸ -"
                      )

                  # 목금토일 / 월화수 사이 구분선
                  if day_name == "일요일":
                      lines.append("────────────")

              embeds.append({
                  "title": party["name"],
                  "description": "\n".join(lines),
                  "color": party["color"],
                  "footer": {
                      "text": f"🕒 마지막 업데이트 · {updated_at} (KST)"
                  }
              })

          payload = {
              "content": (
                  "📅 **레이드 일정**\n"
                  "🔗 [일정 입력·수정하러 가기]"
                  "(https://wer2215-crypto.github.io/-/)"
              ),
              "embeds": embeds
          }

          with open(
              "/tmp/discord_payload.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  payload,
                  f,
                  ensure_ascii=False
              )

          with open(
              "/tmp/new_schedule_hash.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(digest + "\n")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("SEND_DISCORD=true\n")

          print("Discord payload created.")
          print(f"Last update: {updated_at} KST")
          PY

      - name: Update existing Discord message
        if: env.SEND_DISCORD == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_MESSAGE_ID: ${{ secrets.DISCORD_MESSAGE_ID }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret is missing."
            exit 1
          fi

          if [ -z "$DISCORD_MESSAGE_ID" ]; then
            echo "DISCORD_MESSAGE_ID secret is missing."
            exit 1
          fi

          echo "Updating existing Discord message..."

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/discord_response.txt \
            --write-out "%{http_code}" \
            --request PATCH \
            --header "Content-Type: application/json" \
            --header "User-Agent: Mozilla/5.0" \
            --data-binary "@/tmp/discord_payload.json" \
            "${DISCORD_WEBHOOK}/messages/${DISCORD_MESSAGE_ID}")

          echo "Discord HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Discord rejected the message update."
            cat /tmp/discord_response.txt
            exit 1
          fi

          echo "Existing Discord message updated successfully."

      - name: Save schedule state
        if: env.SEND_DISCORD == 'true'
        run: |
          mkdir -p .github

          cp \
            /tmp/new_schedule_hash.txt \
            .github/last_schedule_hash.txt

          git config user.name "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/last_schedule_hash.txt

          if git diff --cached --quiet; then
            echo "No state change to commit."
            exit 0
          fi

          git commit -m "Update raid schedule sync state"
          git push
