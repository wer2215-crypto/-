<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레이드 일정 공유표</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --accent-color: #3b82f6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .controls { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 15px; 
            align-items: center; 
            flex-wrap: wrap;
            justify-content: center;
        }
        select, button {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: var(--accent-color); }
        .grid-container {
            background: var(--card-bg);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            max-height: 80vh;
            max-width: 100%;
            overflow-x: auto;
            overflow-y: auto;
            box-sizing: border-box;
        }
        table { border-collapse: collapse; user-select: none; width: 100%; }
        th, td {
            border: 1px solid var(--border-color);
            padding: 6px 4px;
            text-align: center;
            min-width: 65px;
            font-size: 12px;
        }
        /* 시간 열 고정 및 시간/요일 헤더 처리 */
        th { background-color: #0f172a; position: sticky; top: 0; z-index: 10; }
        th:first-child, td:first-child {
            position: sticky;
            left: 0;
            background-color: #1e293b;
            z-index: 11;
            min-width: 55px;
        }
        th:first-child { z-index: 20; background-color: #0f172a; }
        
        .cell { cursor: pointer; font-size: 12px; font-weight: bold; }
        .cell.available { background-color: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .cell.unavailable { background-color: rgba(239, 68, 68, 0.25); color: #f87171; }
        .names { font-size: 10px; color: #fca5a5; margin-top: 2px; font-weight: normal; word-break: break-all; }
    </style>
    <!-- Firebase SDK 로드 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AiZaSyAdtqhAf0vkaF8Y-P8K9gBGK-L4CGK0By8",
            authDomain: "raid-c2ee1.firebaseapp.com",
            databaseURL: "https://raid-c2ee1-default-rtdb.firebaseio.com",
            projectId: "raid-c2ee1",
            storageBucket: "raid-c2ee1.firebasestorage.app",
            messagingSenderId: "480238107862",
            appId: "1:480238107862:web:c696a45a066f2235de9d77"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const scheduleRef = ref(db, 'raid_schedule');

        const members = ['뱁새', '담곰', '두지', '깜고', '이리', '시요'];
        const days = ['목', '금', '토', '일', '월', '화', '수'];
        const hours = [
            '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', 
            '16:00', '17:00', '18:00', '19:00', '20:00', '21:00', 
            '22:00', '23:00', '24:00', '01:00', '02:00'
        ];

        let scheduleData = Array(7).fill().map(() => Array(hours.length).fill().map(() => Array(6).fill(false)));

        onValue(scheduleRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                scheduleData = data;
                renderGrid();
            }
        });

        window.toggleCell = function(day, hour) {
            const currentMember = parseInt(document.getElementById('memberSelect').value);
            scheduleData[day][hour][currentMember] = !scheduleData[day][hour][currentMember];
            set(scheduleRef, scheduleData);
        };

        window.resetData = function() {
            if(confirm("모든 파티원의 일정을 초기화하시겠습니까?")) {
                const emptyData = Array(7).fill().map(() => Array(hours.length).fill().map(() => Array(6).fill(false)));
                set(scheduleRef, emptyData);
            }
        };

        window.renderGrid = function() {
            const currentMember = parseInt(document.getElementById('memberSelect').value);
            const table = document.getElementById('scheduleTable');
            table.innerHTML = '';

            let headerHTML = '<tr><th>시간</th>';
            days.forEach(d => headerHTML += `<th>${d}</th>`);
            headerHTML += '</tr>';
            table.innerHTML += headerHTML;

            hours.forEach((h, hIdx) => {
                let rowHTML = `<tr><th>${h}</th>`;
                days.forEach((d, dIdx) => {
                    const unavailableList = scheduleData[dIdx][hIdx] || Array(6).fill(false);
                    const unavailNames = members.filter((_, mIdx) => unavailableList[mIdx]);
                    const unavailableCount = unavailNames.length;

                    let statusText = '';
                    let cellClass = 'cell ';

                    if (unavailableCount === 0) {
                        statusText = '가능⭕';
                        cellClass += 'available';
                    } else {
                        statusText = `불가❌ (${unavailableCount}명)`;
                        statusText += `<div class="names">(${unavailNames.join(', ')})</div>`;
                        cellClass += 'unavailable';
                    }

                    rowHTML += `<td class="${cellClass}" onclick="toggleCell(${dIdx}, ${hIdx})">${statusText}</td>`;
                });
                rowHTML += '</tr>';
                table.innerHTML += rowHTML;
            });
        };
    </script>
</head>
<body>

    <h2>🕊️🐻‍❄️🌸🐈‍⬛🐹😾 일정 공유표</h2>
    <p style="color: #94a3b8; font-size: 13px;">본인 선택한 후 안 되는 시간대 클릭</p>

    <div class="controls">
        <label for="memberSelect">내 닉네임:</label>
        <select id="memberSelect" onchange="renderGrid()">
            <option value="0">뱁새</option>
            <option value="1">담곰</option>
            <option value="2">두지</option>
            <option value="3">깜고</option>
            <option value="4">이리</option>
            <option value="5">시요</option>
        </select>
        <button onclick="resetData()">전체 초기화</button>
    </div>

    <div class="grid-container">
        <table id="scheduleTable"></table>
    </div>

</body>
</html>
