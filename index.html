<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6인 레이드 일정 공유표</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --accent-color: #3b82f6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
        select, button {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: var(--accent-color); }
        .grid-container {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            max-height: 80vh;
            overflow-y: auto;
        }
        table { border-collapse: collapse; user-select: none; }
        th, td {
            border: 1px solid var(--border-color);
            padding: 8px 6px;
            text-align: center;
            min-width: 95px;
        }
        th { background-color: #0f172a; position: sticky; top: 0; z-index: 10; }
        .cell { cursor: pointer; font-size: 13px; font-weight: bold; }
        .cell.available { background-color: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .cell.unavailable { background-color: rgba(239, 68, 68, 0.25); color: #f87171; }
        .names { font-size: 11px; color: #fca5a5; margin-top: 3px; font-weight: normal; }
    </style>
</head>
<body>

    <h2>🎮 6인 레이드 일정 공유표</h2>
    <p style="color: #94a3b8;">본인 닉네임을 선택한 후 안 되는 시간대를 클릭하여 토글하세요.</p>

    <div class="controls">
        <label for="memberSelect">내 닉네임:</label>
        <select id="memberSelect" onchange="renderGrid()">
            <option value="0">뱁새</option>
            <option value="1">담곰</option>
            <option value="2">두지</option>
            <option value="3">깜고</option>
            <option value="4">이리</option>
            <option value="5">시요</option>
        </select>
        <button onclick="resetData()">전체 초기화</button>
    </div>

    <div class="grid-container">
        <table id="scheduleTable"></table>
    </div>

    <script>
        const members = ['뱁새', '담곰', '두지', '깜고', '이리', '시요'];
        const days = ['목', '금', '토', '일', '월', '화', '수'];
        
        // 10:00 ~ 24:00 (00:00), 새벽 01:00, 02:00
        const hours = [
            '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', 
            '16:00', '17:00', '18:00', '19:00', '20:00', '21:00', 
            '22:00', '23:00', '24:00', '01:00', '02:00'
        ];
        
        let scheduleData = JSON.parse(localStorage.getItem('raid_schedule_custom_hours')) || 
            Array(7).fill().map(() => Array(hours.length).fill().map(() => Array(6).fill(false)));

        function saveData() { localStorage.setItem('raid_schedule_custom_hours', JSON.stringify(scheduleData)); }

        function resetData() {
            if(confirm("모든 일정을 초기화하시겠습니까?")) {
                scheduleData = Array(7).fill().map(() => Array(hours.length).fill().map(() => Array(6).fill(false)));
                saveData(); renderGrid();
            }
        }

        function toggleCell(day, hour) {
            const currentMember = parseInt(document.getElementById('memberSelect').value);
            scheduleData[day][hour][currentMember] = !scheduleData[day][hour][currentMember];
            saveData(); renderGrid();
        }

        function renderGrid() {
            const currentMember = parseInt(document.getElementById('memberSelect').value);
            const table = document.getElementById('scheduleTable');
            table.innerHTML = '';

            let headerHTML = '<tr><th>시간/요일</th>';
            days.forEach(d => headerHTML += `<th>${d}</th>`);
            headerHTML += '</tr>';
            table.innerHTML += headerHTML;

            hours.forEach((h, hIdx) => {
                let rowHTML = `<tr><th>${h}</th>`;
                days.forEach((d, dIdx) => {
                    const unavailableList = scheduleData[dIdx][hIdx];
                    
                    // 안 되는 사람 명단 추출
                    const unavailNames = members.filter((_, mIdx) => unavailableList[mIdx]);
                    const unavailableCount = unavailNames.length;

                    let statusText = '';
                    let cellClass = 'cell ';

                    if (unavailableCount === 0) {
                        statusText = '가능⭕';
                        cellClass += 'available';
                    } else {
                        statusText = `불가❌ (${unavailableCount}명)`;
                        // 안 되는 멤버 이름 표시
                        statusText += `<div class="names">(${unavailNames.join(', ')})</div>`;
                        cellClass += 'unavailable';
                    }

                    rowHTML += `<td class="${cellClass}" onclick="toggleCell(${dIdx}, ${hIdx})">${statusText}</td>`;
                });
                rowHTML += '</tr>';
                table.innerHTML += rowHTML;
            });
        }

        renderGrid();
    </script>
</body>
</html>
